name: Build Frame Assist (Android64)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android64:
    name: Compilar Android64 (.geode)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Compilar mod con Geode SDK
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: v6.0.0

      - name: Subir archivo .geode
        uses: actions/upload-artifact@v4
        with:
          name: FrameAssist-Android64
          path: '**/*.geode'
          if-no-files-found: error
          
